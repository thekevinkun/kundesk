# CI pipeline — runs on every push and PR to master
# Checks: TypeScript, ESLint, Vitest
# CodeRabbit runs separately as a GitHub App on every PR

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Typecheck + Lint + Test
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Node.js — matches our local version
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # TypeScript check — zero errors required
      - name: Typecheck
        run: npm run typecheck
        env:
          # Placeholder env vars so lib/env.ts doesn't throw during CI
          DATABASE_URL: postgresql://placeholder
          CLERK_SECRET_KEY: placeholder
          CLERK_WEBHOOK_SECRET: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          KUNDESK_AI_MODE: mock
          KUNDESK_EMBEDDING_MODE: mock
          KUNDESK_STORAGE_MODE: mock
          KUNDESK_PAYMENT_MODE: mock
          KUNDESK_REALTIME_MODE: mock
          KUNDESK_EMAIL_MODE: mock

      # ESLint — zero errors required
      - name: Lint
        run: npm run lint
        env:
          DATABASE_URL: postgresql://placeholder
          CLERK_SECRET_KEY: placeholder
          CLERK_WEBHOOK_SECRET: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          KUNDESK_AI_MODE: mock
          KUNDESK_EMBEDDING_MODE: mock
          KUNDESK_STORAGE_MODE: mock
          KUNDESK_PAYMENT_MODE: mock
          KUNDESK_REALTIME_MODE: mock
          KUNDESK_EMAIL_MODE: mock

      # Vitest — no tests yet but infrastructure is ready
      # Vitest — 101 tests across helpers and lib/redis
      - name: Test
        run: npm run test -- --run
        env:
          DATABASE_URL: postgresql://placeholder
          CLERK_SECRET_KEY: placeholder
          CLERK_WEBHOOK_SECRET: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          KUNDESK_AI_MODE: mock
          KUNDESK_EMBEDDING_MODE: mock
          KUNDESK_STORAGE_MODE: mock
          KUNDESK_PAYMENT_MODE: mock
          KUNDESK_REALTIME_MODE: mock
          KUNDESK_EMAIL_MODE: mock

      # Build — catches import errors and Next.js compilation failures
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://fake:fake@fake.neon.tech/fake
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_fake
          CLERK_SECRET_KEY: sk_test_fake
          CLERK_WEBHOOK_SECRET: whsec_fake
          UPSTASH_REDIS_REST_URL: https://fake.upstash.io
          UPSTASH_REDIS_REST_TOKEN: fake_token
          NEXT_PUBLIC_PUSHER_KEY: fake_pusher_key
          NEXT_PUBLIC_PUSHER_CLUSTER: ap1
          NEXT_PUBLIC_APP_URL: https://kundesk.app
          NEXT_PUBLIC_POSTHOG_KEY: phc_fake
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          NEXT_PUBLIC_SENTRY_DSN: https://fake@fake.ingest.sentry.io/fake
          KUNDESK_AI_MODE: mock
          KUNDESK_EMBEDDING_MODE: mock
          KUNDESK_STORAGE_MODE: mock
          KUNDESK_PAYMENT_MODE: mock
          KUNDESK_REALTIME_MODE: mock
          KUNDESK_EMAIL_MODE: mock
